<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wings</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 2rem; max-width: 640px; }
        .badges { margin-top: 1rem; }
        .badge { display: inline-block; padding: 0.35rem 0.7rem; border-radius: 4px; font-size: 0.85rem; font-family: monospace; margin-right: 0.4rem; }
        .badge-env { background: #e8f4f8; color: #0369a1; }
        .badge-version { background: #f0fdf4; color: #166534; }
    </style>
</head>
<body>
    <h1>Wings</h1>
    <p>Welcome to Wings — built and deployed by IndentWork.</p>
    <div class="badges">
        <span class="badge badge-env">env: {{ env }}</span>
        <span class="badge badge-version">v{{ version }}</span>
    </div>
</body>
</html>
