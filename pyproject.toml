[project]
name = "wings"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.5",
]

[dependency-groups]
dev = [
    "black>=25.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "python-semantic-release>=9.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wings.settings"
python_files = ["tests.py", "test_*.py"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = ""
upload_to_pypi = false
upload_to_vcs_release = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "hotfix", "refactor", "perf", "style", "test", "docs", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "hotfix", "refactor", "perf"]
