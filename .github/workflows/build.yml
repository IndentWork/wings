name: Build

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [version]
    if: needs.version.outputs.released == 'true'

    env:
      ACR_NAME: acrwings01
      IMAGE_NAME: wings

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Log in to ACR
        run: az acr login --name $ACR_NAME

      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.version.outputs.version }} \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:latest \
            --label org.opencontainers.image.version=${{ needs.version.outputs.version }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .

      - name: Push to ACR
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.version.outputs.version }}
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest
