name: Validate

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Bootstrap"]
    types: [completed]
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: black
        run: uv run black --check .

      - name: isort
        run: uv run isort --check-only .

      - name: flake8
        run: uv run flake8 .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest
